services:
  - type: web
    name: aura-qms-pharma
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r backend/requirements.txt && cd frontend && npm install && npm run build && cd .."
    startCommand: "python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_FALLBACK_MODEL
        value: qwen/qwen3.8-27b
      - key: DATABASE_URL
        value: sqlite:///./rca_pharma.db
